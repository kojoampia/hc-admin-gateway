# Neither the d3.js security-holding package nor the Angular sanitization-bypass advisories were
# found by tooling — both surfaced in a manual audit, which is the argument for this file existing.
#
# Weekly, not daily: three repositories on one reviewer, and a PR nobody reads is not a gate.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Spring Boot's modules move in lockstep; separate PRs for each would never merge cleanly.
      spring:
        patterns: ['org.springframework*', 'org.springframework.boot*', 'org.springframework.cloud*']
      testing:
        patterns: ['org.junit*', 'org.mockito*', 'org.testcontainers*', 'org.assertj*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
